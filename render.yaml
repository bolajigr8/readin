services:
  - type: web
    name: readin-server
    runtime: docker
    dockerfilePath: server/Dockerfile
    dockerContext: server
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # All secrets below are set in the Render dashboard, not here.
      # Listed as references so the dashboard prompts you for each one.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: TEMP_DIR
        value: /tmp
      - key: MAX_CONVERSION_CONCURRENT
        value: 2
