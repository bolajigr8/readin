services:
  - type: web
    name: readin-server
    runtime: docker
    dockerfilePath: server/Dockerfile
    dockerContext: server
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: true
    # Rebuild only when the server changes — not for app, admin, website or docs commits (S3.3).
    # (Only used if the service is managed by this Blueprint / auto-deploy is on.)
    buildFilter:
      paths:
        - server/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # All secrets below are set in the Render dashboard, not here.
      # Listed as references so the dashboard prompts you for each one.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: CONVERSION_ENABLED
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: TEMP_DIR
        value: /tmp
      - key: MAX_CONVERSION_CONCURRENT
        value: 2
