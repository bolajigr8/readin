name: readin_flutter
description: "ReadIn - e-reader (Flutter port of the React Native app)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State / routing / network
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.9.2

  # Storage
  flutter_secure_storage: ^10.1.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.3
  url_launcher: ^6.3.2
  file_picker: ^8.1.7

  # Auth
  google_sign_in: ^6.3.0

  # Reader
  webview_flutter: ^4.10.0
  pdfrx: ^2.0.0

  # Audio
  flutter_tts: ^4.0.2
  just_audio: ^0.9.40

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# Optional later: purchases_flutter (real purchases), firebase_messaging (push).

# Run once after `flutter pub get`:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/icon.png
  adaptive_icon_background: assets/icons/android-icon-background.png
  adaptive_icon_foreground: assets/icons/android-icon-foreground.png
  adaptive_icon_monochrome: assets/icons/android-icon-monochrome.png

flutter_native_splash:
  color: "#0A0A0A"
  image: assets/images/splash-icon.png
  android_12:
    color: "#0A0A0A"
    image: assets/images/splash-icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/
    - assets/reader/
