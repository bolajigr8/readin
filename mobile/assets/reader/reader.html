<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#0A0A0A}
  #viewer{position:absolute;top:0;left:0;right:0;bottom:0}
</style>
</head>
<body>
<div id="viewer"></div>
<script src="jszip.min.js"></script>
<script src="epub.min.js"></script>
<script>
(function () {
  // ── bridge ────────────────────────────────────────────────────────────────
  var CFG = __READIN_CONFIG__;           // replaced by the Dart server (JSON)
  var book = null, rendition = null, tocMap = {}, lastLoc = null;

  // ── tap zones ─────────────────────────────────────────────────────────────
  // In paged mode epub.js lays the whole chapter out in ONE wide iframe and scrolls
  // the container sideways, so `clientX` inside the iframe counts from the start of
  // the chapter, not from the screen edge. Adding the iframe's on-screen offset
  // (negative once you are past page 1) gives the real position on screen.
  function tapX(e) {
    var x = (e && e.clientX) || 0;
    try {
      var fe = e && e.view && e.view.frameElement;
      if (fe && fe.getBoundingClientRect) x += fe.getBoundingClientRect().left;
    } catch (err) {}
    return x;
  }
  function tapZone(x, width) {
    if (x < width * 0.25) return 'prev';
    if (x > width * 0.75) return 'next';
    return 'menu';
  }

  function post(o) {
    try { ReadIn.postMessage(JSON.stringify(o)); } catch (e) {}
  }
  window.onerror = function (m) { post({ type: 'ERROR', message: String(m) }); };

  var FAMILIES = {
    'serif': "Georgia, 'Times New Roman', serif",
    'sans-serif': "-apple-system, Roboto, 'Segoe UI', sans-serif",
    'literata': "'Literata', Georgia, serif",
    'merriweather': "'Merriweather', Georgia, serif",
    'lora': "'Lora', Georgia, serif",
    'lexend': "'Lexend', Roboto, sans-serif",
    'atkinson': "'Atkinson Hyperlegible', Roboto, sans-serif",
    'opendyslexic': "'OpenDyslexic', 'Comic Sans MS', Roboto, sans-serif"
  };
  // Fonts are BUNDLED with the app (assets/reader/fonts) — they work offline and
  // every choice really changes the text. file = prefix of the .woff2 files.
  var FONT_FILES = {
    merriweather: { family: 'Merriweather', file: 'merriweather', faces: [[300,'normal'],[400,'normal'],[700,'normal'],[900,'normal'],[400,'italic'],[700,'italic']] },
    literata: { family: 'Literata', file: 'literata', faces: [[300,'normal'],[400,'normal'],[700,'normal'],[900,'normal'],[400,'italic'],[700,'italic']] },
    lora: { family: 'Lora', file: 'lora', faces: [[400,'normal'],[700,'normal'],[400,'italic'],[700,'italic']] },
    lexend: { family: 'Lexend', file: 'lexend', faces: [[300,'normal'],[400,'normal'],[700,'normal'],[900,'normal']] },
    atkinson: { family: 'Atkinson Hyperlegible', file: 'atkinson-hyperlegible', faces: [[400,'normal'],[700,'normal'],[400,'italic'],[700,'italic']] },
    opendyslexic: { family: 'OpenDyslexic', file: 'opendyslexic', faces: [[400,'normal'],[700,'normal'],[400,'italic'],[700,'italic']] }
  };
  var FONT_FACE_CSS = (function () {
    var base = new URL('fonts/', document.baseURI).href, css = '';
    Object.keys(FONT_FILES).forEach(function (k) {
      var f = FONT_FILES[k];
      f.faces.forEach(function (x) {
        css += "@font-face{font-family:'" + f.family + "';font-style:" + x[1] + ";font-weight:" + x[0] +
          ";font-display:swap;src:url('" + base + f.file + '-latin-' + x[0] + '-' + x[1] + ".woff2') format('woff2');}";
      });
    });
    return css;
  })();
  var THEMES = {
    dark:  { bg: '#0A0A0A', fg: '#E4E4E7' },
    light: { bg: '#FFFFFF', fg: '#1A1A1A' },
    sepia: { bg: '#F0DEC6', fg: '#121212' },
    night: { bg: '#000000', fg: '#B4B4B4' }
  };
  var IS_SCROLL = CFG.flow === 'scroll';

  // p = { fontSize, fontFamily, theme, lineHeight, margin, align, hyphenate, fontWeight }
  function themeRules(p) {
    var t = THEMES[p.theme] || THEMES.dark;
    var fam = FAMILIES[p.fontFamily] || FAMILIES['sans-serif'];
    var lh = p.lineHeight || 1.5;
    var w = p.fontWeight || 400;
    var hy = p.hyphenate !== false && p.align === 'justify' ? 'auto' : 'manual';
    var rules = {
      'html,body,p,span,div,li,td,th,h1,h2,h3,h4,h5,h6,blockquote,dd,dt,em,i,a': {
        'color': t.fg + ' !important',
        'background': 'transparent !important',
        'font-family': fam + ' !important',
        'font-weight': w + ' !important'
      },
      // <b>/<strong> stay heavier than the body text
      'b,strong': { 'font-weight': (w >= 700 ? 900 : 700) + ' !important' },
      // Books give their own paragraphs a line-height, so it must be set on the text elements too.
      'p,li,blockquote,dd,dt,div,span,a,td,th': { 'line-height': lh + ' !important' },
      'p,li': {
        'text-align': (p.align === 'justify' ? 'justify' : 'left') + ' !important',
        'hyphens': hy + ' !important',
        '-webkit-hyphens': hy + ' !important'
      },
      'body': {
        'background': t.bg + ' !important',
        'font-size': p.fontSize + 'px !important',
        'line-height': lh + ' !important'
      },
      'a': { 'color': '#FB923C !important' },
      'img': { 'max-width': '100% !important' }
    };
    // Paged mode: epub.js sets the side padding itself from the page "gap" (see applyTheme).
    if (IS_SCROLL) rules['body']['padding'] = '0 ' + (p.margin == null ? 16 : p.margin) + 'px !important';
    return rules;
  }

  var layoutKey = null, relayoutTimer = null;
  function gapFor(margin) { return Math.max(0, Math.round((margin == null ? 16 : margin) * 2)); }

  // Re-flows the page after a layout-affecting change, staying at the same place.
  function scheduleRelayout() {
    clearTimeout(relayoutTimer);
    relayoutTimer = setTimeout(function () {
      if (!rendition) return;
      var cfi = lastLoc && lastLoc.start && lastLoc.start.cfi;
      try { rendition.manager.updateLayout(); } catch (e) {}
      try { rendition.display(cfi || undefined); } catch (e) {}
    }, 120);
  }

  // Single registered theme that is re-registered + re-selected on change.
  // The page / book is NEVER reloaded for a settings change.
  function applyTheme(p) {
    if (!rendition) return;
    PAGE_ANIM = p.pageAnim !== 'none';
    var name = 'readin-' + [p.theme, p.fontFamily, p.fontSize, p.lineHeight, p.margin, p.align, p.hyphenate, p.fontWeight, IS_SCROLL ? 's' : 'p'].join('-');
    rendition.themes.register(name, themeRules(p));
    rendition.themes.select(name);
    var t = THEMES[p.theme] || THEMES.dark;
    document.body.style.background = t.bg;
    document.getElementById('viewer').style.background = t.bg;
    try { if (rendition.manager && rendition.manager.settings) rendition.manager.settings.gap = gapFor(p.margin); } catch (e) {}
    var key = [p.fontSize, p.fontFamily, p.fontWeight, p.lineHeight, p.margin, p.align, p.hyphenate].join('|');
    if (layoutKey !== null && key !== layoutKey) scheduleRelayout();
    layoutKey = key;
  }

  function report(loc) {
    if (animating) return;
    if (!loc || !loc.start) return;
    lastLoc = loc;
    var pct = 0;
    try {
      pct = book.locations.length()
        ? Math.round(book.locations.percentageFromCfi(loc.start.cfi) * 100)
        : Math.round((loc.start.percentage || 0) * 100);
    } catch (e) {}
    var page = 0, pages = 0;
    try {
      if (book.locations && book.locations.length()) {
        var li = book.locations.locationFromCfi(loc.start.cfi);
        if (li >= 0) { page = li + 1; pages = book.locations.length(); }
      }
    } catch (e) {}
    var base = (loc.start.href || '').split('#')[0];
    post({
      type: 'LOCATION',
      cfi: loc.start.cfi,
      chapterIndex: loc.start.index || 0,
      chapterTitle: tocMap[base] || '',
      href: base,
      percentage: pct,
      page: page,
      pages: pages,
      locationsReady: !!(book.locations && book.locations.length && book.locations.length())
    });
  }

  // ── commands from Dart:  readerApi.xxx(...) ───────────────────────────────
  // ── auto-scroll + read-aloud state ────────────────────────────────────────
  var autoLevel = 0, autoTimer = null;
  var ttsContents = null, ttsNodes = [], ttsSent = [], ttsCfi = null;

  function ttsClear() {
    if (ttsCfi && rendition) {
      try { rendition.annotations.remove(ttsCfi, 'highlight'); } catch (e) {}
    }
    ttsCfi = null;
  }
  function ttsPoint(p) {
    var lo = 0, hi = ttsNodes.length - 1;
    while (lo < hi) {
      var mid = (lo + hi + 1) >> 1;
      if (ttsNodes[mid].start <= p) lo = mid; else hi = mid - 1;
    }
    var nd = ttsNodes[lo];
    return { node: nd.node, offset: Math.max(0, Math.min(p - nd.start, nd.node.nodeValue.length)) };
  }
  function ttsRange(sent) {
    var a = ttsPoint(sent.s), b = ttsPoint(sent.e);
    var r = ttsContents.document.createRange();
    r.setStart(a.node, a.offset);
    r.setEnd(b.node, b.offset);
    return r;
  }
  // Is the range inside the part of the chapter that is on screen right now?
  function ttsVisible(range) {
    var rect = range.getBoundingClientRect();
    var c = rendition.manager && rendition.manager.container;
    if (!c) return true;
    if (IS_SCROLL) return rect.top >= c.scrollTop - 2 && rect.top < c.scrollTop + c.clientHeight;
    return rect.left >= c.scrollLeft - 2 && rect.left < c.scrollLeft + c.clientWidth;
  }


  // ── page-turn animation ───────────────────────────────────────────────────────
  // epub.js turns a page by JUMPING the scroll position (nothing visibly moves).
  // Here the move is animated with an eased slide (like the big reader apps).
  // Everything that turns a page goes through turn(): while a slide is running a
  // further tap is remembered (max one) and played right after, so pages never
  // end up half-way. Long jumps (contents, search, bookmarks) stay instant.
  var PAGE_ANIM = CFG.pageAnim !== 'none';
  var REDUCED = false;
  try { REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}
  var animating = false, queuedDir = 0, queuedN = 0, animRaf = 0;
  // Remember turns requested while a slide is running (up to 5, same direction).
  function enqueueTurn(dir) {
    queuedN = queuedDir === dir ? Math.min(5, queuedN + 1) : 1;
    queuedDir = dir;
  }
  function turn(dir) {
    if (!rendition) return;
    if (animating) { enqueueTurn(dir); return; }
    if (dir > 0) rendition.next(); else rendition.prev();
  }
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function installPageAnimation() {
    var m = rendition && rendition.manager;
    if (!m || m.__readinAnim) return;
    m.__readinAnim = true;
    var origBy = m.scrollBy.bind(m);
    // epub.js turns a page with scrollBy(±pageWidth). Animate exactly that move.
    m.scrollBy = function (x, y, silent) {
      var c = m.container;
      var ltr = !m.settings || !m.settings.direction || m.settings.direction === 'ltr';
      if (!PAGE_ANIM || REDUCED || IS_SCROLL || !c || !ltr || y || !x ||
          (m.settings && m.settings.fullsize) || Math.abs(x) > c.offsetWidth * 1.6) {
        return origBy(x, y, silent);
      }
      // A move that arrives while a slide is running (rapid taps) is remembered and played next.
      if (animating) { enqueueTurn(x > 0 ? 1 : -1); return; }
      var from = c.scrollLeft, to = from + x, dur = 260, t0 = 0;
      animating = true;
      cancelAnimationFrame(animRaf);
      var finish = function () {
        c.scrollLeft = to;
        animating = false;
        origBy(0, 0, silent); // epub.js learns about the move exactly ONCE, at the end
        if (queuedN > 0) { queuedN--; var d = queuedDir; if (queuedN === 0) queuedDir = 0; turn(d); }
      };
      var step = function (now) {
        if (!t0) t0 = now;
        var p = Math.min(1, (now - t0) / dur);
        c.scrollLeft = from + x * easeOutCubic(p);
        if (p < 1) animRaf = requestAnimationFrame(step); else finish();
      };
      animRaf = requestAnimationFrame(step);
    };
  }

  window.readerApi = {
    next: function () { turn(1); },
    prev: function () { turn(-1); },
    setPageAnim: function (mode) { PAGE_ANIM = mode !== 'none'; },
    display: function (target) {
      if (!rendition) return;
      rendition.display(target).catch(function (e) {
        post({ type: 'ERROR', message: 'Could not navigate: ' + (e && e.message || e) });
      });
    },
    setTheme: function (json) { try { applyTheme(JSON.parse(json)); } catch (e) {} },
    // ── auto-scroll (scroll flow) / auto page turn (paged flow) ───────────────
    autoScroll: function (level) {
      autoLevel = level | 0;
      if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
      if (!rendition || !autoLevel) return;
      var stall = 0, lastTop = -1;
      if (IS_SCROLL) {
        var px = [0, 0.6, 1.2, 2.4][autoLevel] || 1.2;
        autoTimer = setInterval(function () {
          var c = rendition.manager && rendition.manager.container;
          if (!c) return;
          c.scrollTop += px;
          if (c.scrollTop === lastTop) { if (++stall > 40) { stall = 0; rendition.next(); } }
          else { stall = 0; lastTop = c.scrollTop; }
        }, 20);
      } else {
        var ms = [0, 26000, 15000, 8000][autoLevel] || 15000;
        autoTimer = setInterval(function () { turn(1); }, ms);
      }
    },

    // ── read aloud: sentences of the current chapter + highlight ──────────────
    ttsPrepare: function () {
      ttsClear();
      var contents = rendition && rendition.getContents()[0];
      if (!contents) { post({ type: 'TTS_SENTENCES', items: [], start: 0 }); return; }
      var doc = contents.document;
      ttsContents = contents;
      ttsNodes = []; ttsSent = [];
      var full = '';
      var walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, null, false);
      var n;
      while ((n = walker.nextNode())) {
        var v = n.nodeValue || '';
        var pn = n.parentNode && n.parentNode.nodeName;
        if (!v.trim() || pn === 'SCRIPT' || pn === 'STYLE') continue;
        ttsNodes.push({ node: n, start: full.length });
        full += v + ' ';
      }
      var re = /[^.!?]+[.!?]+[\"\u201D\u2019')\]]*|[^.!?]+$/g, m;
      while ((m = re.exec(full))) {
        var raw = m[0], lead = raw.length - raw.replace(/^\s+/, '').length;
        var s = m.index + lead, e = m.index + raw.replace(/\s+$/, '').length;
        while (e - s > 400) {
          var cut = full.lastIndexOf(' ', s + 400);
          if (cut <= s) cut = s + 400;
          ttsSent.push({ s: s, e: cut }); s = cut + 1;
        }
        if (e - s > 2) ttsSent.push({ s: s, e: e });
      }
      var items = ttsSent.map(function (x) { return full.slice(x.s, x.e).replace(/\s+/g, ' '); });
      var start = 0;
      try {
        for (var i = 0; i < Math.min(ttsSent.length, 600); i++) {
          if (ttsVisible(ttsRange(ttsSent[i]))) { start = i; break; }
        }
      } catch (err) {}
      post({ type: 'TTS_SENTENCES', items: items, start: start });
    },
    ttsHighlight: function (i) {
      ttsClear();
      var sent = ttsSent[i];
      if (!sent || !rendition) return;
      try {
        var r = ttsRange(sent);
        var cfi = ttsContents.cfiFromRange(r);
        rendition.annotations.add('highlight', cfi, {}, null, 'tts-hl',
          { fill: '#FBBF24', 'fill-opacity': '0.45', 'mix-blend-mode': 'normal' });
        ttsCfi = cfi;
        if (!ttsVisible(r)) rendition.display(cfi);
      } catch (e) {}
    },
    ttsClear: function () { ttsClear(); },

    setFlow: function (mode) {
      if (!rendition) return;
      IS_SCROLL = mode === 'scroll';
      if (autoLevel) setTimeout(function () { readerApi.autoScroll(autoLevel); }, 600);
      var cfi = lastLoc && lastLoc.start && lastLoc.start.cfi;
      try { rendition.flow(IS_SCROLL ? 'scrolled-doc' : 'paginated'); } catch (e) {}
      if (cfi) rendition.display(cfi);
    },
    seekPercent: function (p) {
      if (!rendition || !book || !book.locations || !book.locations.length()) return;
      var cfi = book.locations.cfiFromPercentage(Math.max(0, Math.min(1, p)));
      if (cfi) rendition.display(cfi);
    },
    // Full-text search, chapter by chapter (sequential: low memory).
    search: function (q) {
      if (!book || !q) { post({ type: 'SEARCH_RESULTS', query: q || '', results: [] }); return; }
      var results = [];
      var items = [];
      book.spine.each(function (it) { items.push(it); });
      items.reduce(function (chain, item) {
        return chain.then(function () {
          if (results.length >= 80) return;
          return item.load(book.load.bind(book)).then(function () {
            var found = item.find(q) || [];
            for (var i = 0; i < found.length && results.length < 80; i++) {
              results.push({ cfi: found[i].cfi, excerpt: found[i].excerpt });
            }
            item.unload();
          }).catch(function () {});
        });
      }, Promise.resolve()).then(function () {
        post({ type: 'SEARCH_RESULTS', query: q, results: results });
      });
    },
    // epub.js "next section" / "previous section" for the chapter buttons
    nextSection: function () {
      if (!rendition || !lastLoc) return;
      var idx = (lastLoc.start.index || 0) + 1;
      var s = book.spine.get(idx);
      if (s) rendition.display(s.href);
    },
    prevSection: function () {
      if (!rendition || !lastLoc) return;
      var idx = (lastLoc.start.index || 0) - 1;
      var s = idx >= 0 ? book.spine.get(idx) : null;
      if (s) rendition.display(s.href);
    },
    highlight: function (cfiRange, color, id) {
      if (!rendition) return;
      try {
        rendition.annotations.add('highlight', cfiRange, { id: id },
          function () { post({ type: 'ANNOTATION_CLICKED', id: id }); },
          'hl-' + id,
          { fill: color, 'fill-opacity': '0.35', 'mix-blend-mode': 'multiply' });
      } catch (e) {}
    },
    clearSelection: function () {
      if (!rendition) return;
      try {
        rendition.getContents().forEach(function (c) {
          var s = c.window.getSelection();
          if (s) s.removeAllRanges();
        });
      } catch (e) {}
    },
    removeHighlight: function (cfiRange) {
      if (!rendition) return;
      try { rendition.annotations.remove(cfiRange, 'highlight'); } catch (e) {}
    }
  };

  // ── keep the screen on while reading (Screen Wake Lock API) ───────────────
  var wakeLock = null;
  function lockScreen() {
    try {
      if (navigator.wakeLock && !wakeLock) {
        navigator.wakeLock.request('screen').then(function (s) {
          wakeLock = s;
          s.addEventListener('release', function () { wakeLock = null; });
        }).catch(function () {});
      }
    } catch (e) {}
  }
  lockScreen();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') lockScreen();
  });

  // ── open the book ─────────────────────────────────────────────────────────
  try {
    fetch(CFG.bookUrl)
      .then(function (r) {
        if (!r.ok) throw new Error('Book file not available (HTTP ' + r.status + ')');
        return r.arrayBuffer();
      })
      .then(function (buf) {
        book = ePub(buf);
        rendition = book.renderTo('viewer', {
          width: '100%', height: '100%', spread: 'none',
          flow: IS_SCROLL ? 'scrolled-doc' : 'paginated',
          gap: gapFor(CFG.margin),
          allowScriptedContent: false
        });
        // the page manager is created asynchronously: hook in as soon as it exists
        rendition.started.then(installPageAnimation).catch(function () {});
        applyTheme(CFG);
        // Non-blocking: the page renders at once, the font swaps in when loaded.
        rendition.hooks.content.register(function (contents) {
          try {
            var root = contents.document.documentElement;
            if (!root.getAttribute('lang')) root.setAttribute('lang', (book.package && book.package.metadata && book.package.metadata.language) || 'en');
          } catch (e) {}
          try { contents.addStylesheetCss(FONT_FACE_CSS, 'readin-fonts'); } catch (e) {}
          installPageAnimation(); // (no-op once installed)
        });

        rendition.display(CFG.initialCfi || undefined)
          .then(function () { post({ type: 'BOOK_READY' }); })
          .catch(function (e) {
            // A stale/invalid CFI must not make the book unopenable.
            if (CFG.initialCfi) {
              rendition.display().then(function () { post({ type: 'BOOK_READY' }); })
                .catch(function (e2) { post({ type: 'ERROR', message: 'Could not render book: ' + (e2 && e2.message || e2) }); });
            } else {
              post({ type: 'ERROR', message: 'Could not render book: ' + (e && e.message || e) });
            }
          });

        book.loaded.navigation.then(function (nav) {
          (function walk(items) {
            items.forEach(function (it) {
              if (it.href) tocMap[it.href.split('#')[0]] = (it.label || '').trim();
              if (it.subitems) walk(it.subitems);
            });
          })(nav.toc || []);
          post({ type: 'TOC_READY', toc: nav.toc });
        }).catch(function () {});

        // Lazy locations (1200 chars): does not block reading.
        book.ready.then(function () { return book.locations.generate(1200); })
          .then(function () {
            post({ type: 'LOCATIONS_READY' });
            if (lastLoc) report(lastLoc);
            var l = rendition.currentLocation();
            if (l && l.start) report(l);
          }).catch(function () {});

        rendition.on('relocated', report);

        rendition.on('selected', function (cfiRange, contents) {
          try {
            var s = contents.window.getSelection();
            var t = s ? s.toString().trim() : '';
            if (t) post({ type: 'TEXT_SELECTED', selectedText: t, cfiRange: cfiRange });
          } catch (e) {}
        });

        // Horizontal swipe = page turn (long text selection keeps working).
        var tx = 0, ty = 0, tt = 0;
        rendition.on('touchstart', function (e) {
          var t = e.changedTouches && e.changedTouches[0];
          if (t) { tx = t.screenX; ty = t.screenY; tt = Date.now(); }
        });
        rendition.on('touchend', function (e) {
          var t = e.changedTouches && e.changedTouches[0];
          if (!t) return;
          var dx = t.screenX - tx, dy = t.screenY - ty;
          if (IS_SCROLL || Date.now() - tt > 700) return;
          if (Math.abs(dx) > 50 && Math.abs(dy) < 40 && Math.abs(dx) > Math.abs(dy) * 2) {
            if (dx < 0) turn(1); else turn(-1);
          }
        });

        // Tap zones 25 / 50 / 25 (ignored while text is selected):
        //   left edge = previous page · right edge = next page · middle = show/hide the bars.
        rendition.on('click', function (e) {
          var sel = e.view && e.view.getSelection && e.view.getSelection().toString();
          if (sel) return;
          if (IS_SCROLL) { post({ type: 'TAP' }); return; }
          var zone = tapZone(tapX(e), window.innerWidth);
          if (zone === 'prev') turn(-1);
          else if (zone === 'next') turn(1);
          else post({ type: 'TAP' });
        });
      })
      .catch(function (err) {
        post({ type: 'ERROR', message: 'Failed to initialise reader: ' + (err && err.message || err) });
      });
  } catch (err) {
    post({ type: 'ERROR', message: 'Failed to initialise reader: ' + (err && err.message || err) });
  }
})();
</script>
